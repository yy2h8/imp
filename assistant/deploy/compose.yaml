# Telegram assistant service. From the repo root:
#   cp assistant/.env.example assistant/deploy/assistant.env  # fill in values
#   docker compose -f assistant/deploy/compose.yaml up -d
# State (manual, sessions, jobs, inbox/outbox) persists in the named volume
# mounted at IMP_HOME=/data. Logs: docker compose -f assistant/deploy/compose.yaml logs -f
name: imp-assistant

services:
  assistant:
    build:
      context: ../..
      target: assistant
    image: imp-assistant
    init: true
    restart: unless-stopped
    env_file: assistant.env
    environment:
      IMP_HOME: /data
    volumes:
      - assistant-data:/data

volumes:
  assistant-data:
