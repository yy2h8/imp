name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m pytest
      - run: uv build --wheel
      - name: Verify wheel outside checkout
        shell: bash
        run: |
          uv venv /tmp/imp-wheel-test
          uv pip install --python /tmp/imp-wheel-test/bin/python dist/*.whl
          cd /tmp
          /tmp/imp-wheel-test/bin/python -c "import assistant, imp; from importlib.resources import files; assert files('assistant').joinpath('AGENTS.md.template').is_file()"
          /tmp/imp-wheel-test/bin/imp --help
